<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/*
  Room — prototipe layar HP.
  Surface: OPERATE (utama) — satu aksi penting (mic on/off) sambil berkendara,
  dengan MONITOR sebagai sekunder (siapa yang terhubung, delay, mic yang dipakai).
  Prinsip: bisa dibaca sekilas di bawah matahari, target sentuh besar untuk jari bersarung tangan.
*/
:root {
  --bg: oklch(0.16 0.008 70);
  --surface: oklch(0.21 0.01 70);
  --line: oklch(0.30 0.01 70);
  --ink: oklch(0.97 0.01 90);
  --muted: oklch(0.70 0.015 80);
  --signal: oklch(0.86 0.17 88);      /* kuning hi-vis */
  --signal-ink: oklch(0.20 0.03 80);
  --live: oklch(0.80 0.17 150);
  --warn: oklch(0.80 0.15 60);
  --danger: oklch(0.64 0.21 27);
  --r: 14px;
  --font: "Barlow", system-ui, sans-serif;
  --cond: "Barlow Condensed", "Barlow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: oklch(0.11 0.005 70); color: var(--ink); font-family: var(--font); }
body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px 96px; }
.stage { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
.caption { font: 600 13px/1.4 var(--font); color: var(--muted); max-width: 390px; margin-top: 12px; text-wrap: pretty; }

.phone {
  width: 390px; height: 844px; max-width: 100%;
  background: var(--bg); border-radius: 44px; overflow: hidden;
  border: 1px solid var(--line); position: relative;
  display: flex; flex-direction: column;
}
.statusbar { height: 44px; padding: 0 28px; display: flex; justify-content: space-between; align-items: center; font: 600 14px var(--font); color: var(--muted); }

/* ------- Layar mulai ------- */
.start { flex: 1; padding: 24px 24px 32px; display: flex; flex-direction: column; }
.brand { font: 700 56px/0.9 var(--cond); letter-spacing: -0.01em; margin: 32px 0 8px; }
.brand span { color: var(--signal); }
.lede { color: var(--muted); font-size: 17px; line-height: 1.4; margin: 0 0 40px; text-wrap: pretty; }
label { display: block; font: 600 13px var(--font); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.field { margin-bottom: 24px; }
input {
  width: 100%; height: 60px; border-radius: var(--r); border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: 600 22px var(--font); padding: 0 18px;
}
input:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
.hint { font-size: 14px; color: var(--muted); margin-top: 8px; }
.spacer { flex: 1; }
.btn-primary {
  height: 76px; border: 0; border-radius: var(--r); background: var(--signal); color: var(--signal-ink);
  font: 700 26px var(--cond); letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; width: 100%;
}
.btn-primary:focus-visible, .mute:focus-visible, .chip:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* ------- Layar live ------- */
.live { flex: 1; display: flex; flex-direction: column; padding: 8px 20px 24px; min-height: 0; }
.roomline { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px 16px; }
.roomname { font: 700 34px/1 var(--cond); }
.sub { font: 600 15px var(--font); color: var(--muted); margin-top: 6px; }
.leave { background: none; border: 1px solid var(--line); color: var(--muted); font: 600 15px var(--font); border-radius: 999px; height: 44px; padding: 0 18px; cursor: pointer; }

.route {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center;
  padding: 14px 16px; border-radius: var(--r); background: var(--surface); margin-bottom: 20px;
}
.route .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--live); grid-row: span 2; }
.route .k { font: 600 13px var(--font); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.route .v { font: 600 19px var(--font); }
.route.warn { background: color-mix(in oklch, var(--warn) 18%, var(--surface)); }
.route.warn .dot { background: var(--warn); }
.route .fix { grid-column: 2; font-size: 15px; color: var(--ink); margin-top: 6px; }
.route .fix button { margin-top: 10px; height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--warn); color: var(--signal-ink); font: 700 16px var(--font); cursor: pointer; }

.peers { list-style: none; margin: 0 0 20px; padding: 0; display: flex; flex-direction: column; }
.peer { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; padding: 16px 4px; border-top: 1px solid var(--line); }
.peer:last-child { border-bottom: 1px solid var(--line); }
.peer .name { font: 700 26px/1.1 var(--cond); }
.peer .delay { font: 600 20px var(--font); font-variant-numeric: tabular-nums; text-align: right; }
.peer .delay small { font-size: 13px; color: var(--muted); display: block; font-weight: 600; }
.peer.lost .name, .peer.lost .delay { color: var(--muted); }
.peer.lost .delay { color: var(--danger); }
.meter { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; height: 10px; }
.meter i { background: var(--line); border-radius: 2px; }
.meter i.on { background: var(--live); }
.peer.me .meter i.on { background: var(--signal); }
.peer .tag { font: 600 13px var(--font); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-left: 8px; }

.toggles { display: flex; gap: 10px; margin: 18px 0 20px; }
.chip { flex: 1; height: 52px; border-radius: 12px; border: 1px solid var(--line); background: none; color: var(--muted); font: 600 15px var(--font); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }

.mute {
  margin-top: auto; height: 132px; border: 0; border-radius: 22px; width: 100%;
  background: var(--live); color: var(--signal-ink); cursor: pointer;
  display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px;
  transition: background-color 160ms ease-out, transform 120ms ease-out;
}
.mute:active { transform: scale(0.985); }
.mute b { font: 700 40px/1 var(--cond); letter-spacing: 0.04em; text-transform: uppercase; }
.mute span { font: 600 16px var(--font); opacity: 0.8; }
.mute[aria-pressed="true"] { background: var(--danger); color: var(--ink); }

/* ------- Tweaks ------- */
.tweaks { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
  background: oklch(0.22 0.01 70); border: 1px solid var(--line); padding: 6px; border-radius: 12px; max-width: calc(100vw - 32px); }
.tweaks a { color: var(--muted); text-decoration: none; font: 600 13px var(--font); padding: 8px 12px; border-radius: 8px; }
.tweaks a.cur { background: var(--ink); color: var(--bg); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .mute { transition: none; } }
</style>
</head>
<body>
<div class="stage">
  <div>
    <div class="phone" id="phone">
      <div class="statusbar"><span>09:41</span><span>MiFi · 82%</span></div>

      <!-- LIVE -->
      <section class="live" id="screen-live">
        <div class="roomline">
          <div><div class="roomname">Room</div><div class="sub" id="sub">MiFi · 3 HP tersambung</div></div>
          <button class="leave" onclick="go('live')">Stop</button>
        </div>

        <div class="route" id="route">
          <div class="dot"></div>
          <div class="k">Mic &amp; suara</div>
          <div class="v" id="routeV">Intercom Bluetooth</div>
          <div class="fix" id="routeFix" hidden>
            Mic HP yang terpakai — suara angin & mesin akan masuk.
            <div><button onclick="go('live')">Sambungkan ke intercom</button></div>
          </div>
        </div>

        <ul class="peers" id="peers"></ul>

        <button class="mute" id="mute" aria-pressed="false" onclick="toggleMute()">
          <b id="muteB">Mic nyala</b>
          <span id="muteS">Ketuk untuk bisukan</span>
        </button>
      </section>
    </div>
    <p class="caption" id="cap"></p>
  </div>
</div>

<nav class="tweaks" aria-label="Tweaks">
  <a href="#live">Live</a>
  <a href="#muted">Mic mati</a>
  <a href="#warn">Mic HP</a>
  <a href="#lost">Putus</a>
</nav>

<script>
const caps = {
  live: 'Buka aplikasi = langsung tersambung. Tanpa nama, tanpa kode room: semua HP di MiFi yang sama otomatis satu obrolan. Operate: tombol mic raksasa di bawah (bisa ditekan pakai sarung tangan). Tiap orang: nama, level suara, delay ujung-ke-ujung terukur.',
  muted: 'Mic dibisukan: warna & teks berubah total supaya kelihatan sekilas tanpa membaca.',
  warn: 'Peringatan paling penting: Android diam-diam memakai mic HP. Ini sumber utama suara angin/mesin di versi lama.',
  lost: 'Satu orang hilang dari jaringan > 3 detik: baris meredup, bukan pop-up yang menghalangi.'
};
let peers = [
  { name: 'Redmi Note 12', me: true, delay: null, lvl: 0 },
  { name: 'Samsung A15', delay: 92, lvl: 0 },
  { name: 'Oppo A58', delay: 104, lvl: 0 },
];
let muted = false, state = 'live';

function renderPeers() {
  const ul = document.getElementById('peers');
  ul.innerHTML = peers.map(p => {
    const lost = state === 'lost' && p.name === 'Oppo A58';
    const lvl = (p.me && muted) || lost ? 0 : p.lvl;
    const bars = Array.from({length: 24}, (_, i) => `<i class="${i < lvl ? 'on' : ''}"></i>`).join('');
    const d = p.me ? `<small>kamu</small>${muted ? 'bisu' : 'kirim'}`
      : lost ? `<small>terputus</small>3 dtk` : `<small>delay</small>${p.delay} ms`;
    return `<li class="peer ${p.me ? 'me' : ''} ${lost ? 'lost' : ''}">
      <div class="name">${p.name}${p.me ? '<span class="tag">HP ini</span>' : ''}</div>
      <div class="delay">${d}</div>
      <div class="meter" aria-hidden="true">${bars}</div></li>`;
  }).join('');
}
function toggleMute() { muted = !muted; applyMute(); }
function applyMute() {
  const m = document.getElementById('mute');
  m.setAttribute('aria-pressed', muted);
  document.getElementById('muteB').textContent = muted ? 'Mic mati' : 'Mic nyala';
  document.getElementById('muteS').textContent = muted ? 'Ketuk untuk bicara lagi' : 'Ketuk untuk bisukan';
  renderPeers();
}
function go(s) { location.hash = s; }
function route() {
  state = (location.hash || '#live').slice(1);
  if (!caps[state]) state = 'live';
  document.getElementById('sub').textContent = state === 'lost' ? 'MiFi · 2 dari 3 HP tersambung' : 'MiFi · 3 HP tersambung';
  muted = state === 'muted';
  const warn = state === 'warn';
  document.getElementById('route').classList.toggle('warn', warn);
  document.getElementById('routeV').textContent = warn ? 'Mic HP (bukan intercom)' : 'Intercom Bluetooth';
  document.getElementById('routeFix').hidden = !warn;
  document.querySelectorAll('.tweaks a').forEach(a => a.classList.toggle('cur', a.getAttribute('href') === '#' + state));
  document.getElementById('cap').textContent = caps[state];
  applyMute();
}
window.addEventListener('hashchange', route);
route();

// Simulasi level suara supaya meter terasa hidup.
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduce) setInterval(() => {
  peers.forEach((p, i) => {
    const talking = Math.sin(Date.now() / (900 + i * 400) + i * 2) > 0.2;
    p.lvl = talking ? 6 + Math.floor(Math.random() * 14) : Math.floor(Math.random() * 3);
    if (!p.me) p.delay = Math.round((p.name === 'Samsung A15' ? 88 : 98) + Math.random() * 14);
  });
  renderPeers();
}, 120);
</script>
</body>
</html>
