# Push tag "v<N>" (mis. v2) → bangun APK bertanda tangan dan pasang sebagai asset "room.apk" di Release.
# Aplikasi memeriksa Release terbaru dan memasang dirinya sendiri. N = versionCode, harus naik terus.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Kunci rilis
        run: echo "${{ secrets.ROOM_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/room.jks"
      - name: Build
        env:
          ROOM_KEYSTORE: ${{ runner.temp }}/room.jks
          ROOM_KEYSTORE_PASSWORD: ${{ secrets.ROOM_KEYSTORE_PASSWORD }}
          ROOM_KEY_ALIAS: room
        run: ./gradlew testDebugUnitTest assembleRelease -PversionCode=${GITHUB_REF_NAME#v}
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/release/app-release.apk room.apk
          gh release create "$GITHUB_REF_NAME" room.apk --title "Room $GITHUB_REF_NAME" --generate-notes
